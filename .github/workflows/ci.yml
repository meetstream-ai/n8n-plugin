name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls --all > /dev/null

      - name: Run lint
        run: npm run lint

      - name: Build and run tests
        run: npm test

      - name: Verify publishable package contents
        run: npm pack --dry-run

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Block critical dependency advisories including development tools
        run: npm audit --audit-level=critical

      - name: Report development dependency advisories
        # Known upstream findings remain visible without disguising them as a
        # production failure or forcing unrelated breaking tooling upgrades.
        continue-on-error: true
        run: npm audit --audit-level=moderate
